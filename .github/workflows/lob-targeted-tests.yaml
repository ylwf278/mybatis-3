name: Targeted LOB Handler Tests

on:
  push:
    branches:
      - "fix/3813-free-eager-lob-resources"
    paths:
      - ".github/workflows/lob-targeted-tests.yaml"
      - "src/main/java/org/apache/ibatis/type/**"
      - "src/test/java/org/apache/ibatis/type/**"
      - "pom.xml"
      - "mvnw"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: targeted-lob-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run the four LOB handler test classes
        run: >-
          ./mvnw test --batch-mode --no-transfer-progress --show-version
          -Dlicense.skip=true
          -Dtest=BlobTypeHandlerTest,BlobByteObjectArrayTypeHandlerTest,ClobTypeHandlerTest,NClobTypeHandlerTest
